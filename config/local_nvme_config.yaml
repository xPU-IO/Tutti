# ============================================================================
# local_nvme_config.yaml -- canonical NVMeService deployment fact source.
#
# Phase 3 gives accelerators and NVMe resources explicit identities. Array
# order is presentation only: it must not be used to derive device_id, chrdev,
# block-device, or accelerator-view paths. The daemon obtains actual device
# paths from libnvm owner bring-up and publishes them through RPC.
#
# This file is the preferred daemon example. The parser still accepts one
# complete legacy schema for migration, but canonical and legacy fields cannot
# be mixed in the same file or resource entry.
#
# Schema
# ------
# YAML expresses four deployment facts and policies:
#
#   1. Accelerator enumeration + per-accelerator view directories.
#   2. Explicit NVMe resources + PCI BDFs + backing mount targets.
#   3. Accelerator ACLs for resource acquisition and view publication.
#   4. Daemon policy: per-client queue admission, lease cadence, unmount retry.
#
# Queue capacity is not configured here. The kernel-reported user QID range is
# the source of controller capacity, and the daemon maintains a runtime
# reservation ledger for successful allocations.
#
# Run `sudo scripts/pci_topology_check.sh` to discover NUMA / PCIe-switch
# affinity between accelerators and NVMes; use that result to fill
# allowed_accel_ids.
# ============================================================================

grpc:
  endpoint: "127.0.0.1:50051"

# ---------------------------------------------------------------------------
# Accelerators known to the daemon.
#
# accel_id   Compiled backend ordinal, for example the CUDA device index used
#            by cudaSetDevice when the binary is built with the CUDA backend.
#            The daemon validates IDs and uses them for ACL checks; it does
#            not initialize CUDA/MUSA/MACA or create accelerator contexts.
#
# view_root  Per-accelerator filesystem view root. For every NVMe whose ACL
#            includes accel_id, the daemon publishes a symlink under this root.
#            Clients must consume view_path returned by RPC rather than
#            constructing paths from accel_id or device_id.
# ---------------------------------------------------------------------------
accelerators:
  - accel_id: 0
    view_root: "/mnt/gpu0"
  - accel_id: 1
    view_root: "/mnt/gpu1"
  - accel_id: 2
    view_root: "/mnt/gpu2"
  - accel_id: 3
    view_root: "/mnt/gpu3"

# ---------------------------------------------------------------------------
# NVMe resources the daemon takes exclusive ownership of.
#
# Per-entry schema:
#
#   device_id            Explicit daemon-local NVMe resource identity. It must
#                        be unique and non-negative. Array order is not used as
#                        identity.
#
#   pci_addr             Canonical "DDDD:BB:DD.F". Used by libnvm owner
#                        bring-up to bind/probe the matching pci_dev. The
#                        parser normalizes hexadecimal case.
#
#   backing_mount_path   Filesystem mount point for the owner-returned block
#                        device. When auto_mount=true, the daemon mounts the
#                        actual block_path reported by bring-up here. It also
#                        creates ACCEL<id> subdirectories under this mounted
#                        filesystem and exposes them through view_root
#                        symlinks.
#
#   namespace_id         NVMe namespace ID exposed to clients, usually 1.
#
#   kernel_ioq_cap       Optional NVM_SET_KERNEL_IOQ_CAP pre-bind hint, in
#                        queue-pair units. Zero leaves the cap to the kernel.
#                        Set this when the controller's MSI-X vector budget is
#                        smaller than the host CPU count so the user queue pool
#                        remains usable.
#
#   allowed_accel_ids    ACL and view-publication set. Empty or omitted means
#                        every configured accelerator may acquire this resource.
#
#   auto_mount           When true the daemon mounts block_path at
#                        backing_mount_path during startup and unmounts it
#                        during graceful shutdown.
# ---------------------------------------------------------------------------
nvmes:
  - device_id: 0
    pci_addr: "0000:08:00.0"
    backing_mount_path: "/mnt/nvme0"
    namespace_id: 1
    kernel_ioq_cap: 32
    allowed_accel_ids: [0]
    auto_mount: true
  - device_id: 1
    pci_addr: "0000:4b:00.0"
    backing_mount_path: "/mnt/nvme1"
    namespace_id: 1
    kernel_ioq_cap: 32
    allowed_accel_ids: [1]
    auto_mount: true
  - device_id: 2
    pci_addr: "0000:57:00.0"
    backing_mount_path: "/mnt/nvme2"
    namespace_id: 1
    kernel_ioq_cap: 32
    allowed_accel_ids: [2]
    auto_mount: true
  - device_id: 3
    pci_addr: "0000:63:00.0"
    backing_mount_path: "/mnt/nvme3"
    namespace_id: 1
    kernel_ioq_cap: 32
    allowed_accel_ids: [3]
    auto_mount: true

# ---------------------------------------------------------------------------
# Per-client allocation policy.
#
#   default_per_client      queues_per_controller == 0, or legacy
#                           ConnectRequest.num_queues == 0, uses this value.
#
#   max_per_client          Hard cap for a single client allocation. The
#                           effective grant is also clamped by the
#                           kernel-reported max_queues_per_group and current
#                           available queue capacity.
# ---------------------------------------------------------------------------
queue_pool:
  default_per_client: 16
  max_per_client: 32

# ---------------------------------------------------------------------------
# Lease lifetime parameters.
#
#   heartbeat_interval_sec  Client heartbeat cadence. The reaper scans at half
#                           this interval, with a minimum one-second tick.
#
#   timeout_sec             Silent allocations older than this are candidates
#                           for reaping, subject to kill(pid, 0) and
#                           /proc/<pid>/stat starttime checks.
#
# Rule of thumb: timeout_sec >= 2 * heartbeat_interval_sec.
# ---------------------------------------------------------------------------
lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30

# ---------------------------------------------------------------------------
# Auto-unmount retry policy.
#
# When the daemon receives SIGTERM/SIGINT and a daemon-owned mount returns
# EBUSY, it scans /proc to report holders and retries after interval_ms up to
# max times. A second signal during the retry loop requests immediate exit and
# may leave busy mounts in place for operator cleanup.
# ---------------------------------------------------------------------------
unmount_retry:
  interval_ms: 1000
  max: 30
