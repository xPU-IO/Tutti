# ============================================================================
# Canonical NVMeService deployment fact source.
#
# Phase 3 gives accelerators and NVMe resources explicit identities. Array
# order is presentation only: it must not be used to derive device_id, chrdev,
# block-device, or accelerator-view paths. The daemon obtains actual device
# paths from libnvm owner bring-up and publishes them through RPC.
#
# The application loader switches to allocation metadata in phase 4; until
# then this file remains the daemon's canonical configuration example.
# ============================================================================
grpc:
  endpoint: "127.0.0.1:50051"

# Compiled backend ordinals and their view roots. The daemon validates IDs and
# publishes links here, but does not initialize the accelerator runtime.
accelerators:
  - {accel_id: 0, view_root: "/mnt/gpu0"}
  - {accel_id: 1, view_root: "/mnt/gpu1"}
  - {accel_id: 2, view_root: "/mnt/gpu2"}
  - {accel_id: 3, view_root: "/mnt/gpu3"}

# NVMe resources owned exclusively by the daemon.
#
# device_id: explicit stable resource identity.
# pci_addr: canonical PCI BDF used for owner bind/probe.
# backing_mount_path: real filesystem mount target for returned block_path.
# namespace_id: namespace exposed by the owner bring-up.
# kernel_ioq_cap: optional pre-bind kernel I/O-QP hint; zero means no hint.
# allowed_accel_ids: ACL and view-publication set; empty means all configured.
# auto_mount: daemon owns mount/unmount when true.
nvmes:
  - {device_id: 0, pci_addr: "0000:08:00.0", backing_mount_path: "/mnt/nvme0", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [0], auto_mount: true}
  - {device_id: 1, pci_addr: "0000:4b:00.0", backing_mount_path: "/mnt/nvme1", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [1], auto_mount: true}
  - {device_id: 2, pci_addr: "0000:57:00.0", backing_mount_path: "/mnt/nvme2", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [2], auto_mount: true}
  - {device_id: 3, pci_addr: "0000:63:00.0", backing_mount_path: "/mnt/nvme3", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [3], auto_mount: true}

# Per-client admission policy. Controller capacity comes from the kernel user
# QID pool and is reserved atomically by the daemon allocation ledger.
queue_pool: {default_per_client: 16, max_per_client: 16}

# Lease timeout and heartbeat cadence for allocation reclamation.
lease: {heartbeat_interval_sec: 10, timeout_sec: 30}

# Graceful-shutdown retry policy for daemon-owned mounts returning EBUSY.
unmount_retry: {interval_ms: 1000, max: 30}
