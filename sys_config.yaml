# ============================================================================
# Canonical NVMeService daemon example.
#
# Accelerator IDs are compiled-backend ordinals. NVMe device IDs are explicit
# resource identities. Neither identity nor /dev paths come from YAML array
# order; actual chrdev/block paths are returned by libnvm owner bring-up.
# ============================================================================
grpc:
  endpoint: "127.0.0.1:50051"

# The daemon publishes resource views below view_root without calling CUDA or
# another accelerator runtime.
accelerators:
  - accel_id: 0
    view_root: "/mnt/gpu0"

# Per-resource fields:
#   device_id             explicit unique daemon resource ID
#   pci_addr              canonical PCI BDF used for owner bind/probe
#   backing_mount_path    real filesystem mount target
#   namespace_id          namespace ID supplied to clients
#   kernel_ioq_cap        optional pre-bind kernel I/O-QP hint
#   allowed_accel_ids     ACL; empty means all configured accelerators
#   auto_mount            daemon owns mount/unmount when true
nvmes:
  - {device_id: 0, pci_addr: "0000:08:00.0", backing_mount_path: "/mnt/nvme0", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [0], auto_mount: true}
  - {device_id: 1, pci_addr: "0000:4b:00.0", backing_mount_path: "/mnt/nvme1", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [0], auto_mount: true}
  - {device_id: 2, pci_addr: "0000:57:00.0", backing_mount_path: "/mnt/nvme2", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [0], auto_mount: true}
  - {device_id: 3, pci_addr: "0000:63:00.0", backing_mount_path: "/mnt/nvme3", namespace_id: 1, kernel_ioq_cap: 32, allowed_accel_ids: [0], auto_mount: true}

# Admission policy only. The runtime capacity comes from the kernel-reported
# user QID pool and is tracked by the daemon's atomic reservation ledger.
queue_pool: {default_per_client: 16, max_per_client: 16}

# Lease/reaper and graceful-unmount policy.
lease: {heartbeat_interval_sec: 10, timeout_sec: 30}
unmount_retry: {interval_ms: 1000, max: 30}
