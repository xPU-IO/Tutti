[build-system]
# torch / vllm 由 tutti-env 提供（third_pkgs 源码 editable 安装，
# doc/intergration/tutti-vllm-manual.md）；隔离构建会去 PyPI 拉 cu130
# wheel 而失败，故只声明 setuptools 并用 --no-build-isolation 安装。
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tutti-vllm-connector"
version = "0.1.0"
description = "Tutti external vLLM connector: TuttiConnectorV1 scheduler adapter + TuttiEngine (ARCHITECTURE.md)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
# PEP 420 命名空间包：adapter/ 与 engine/ 无 __init__.py（纯目录即包）。
include = ["adapter*", "engine*", "index*", "stores*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不生成 .pytest_cache（env-tutti.sh 的 PYTEST_ADDOPTS 是全局兜底）
addopts = "-p no:cacheprovider"
