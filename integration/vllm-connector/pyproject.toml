[build-system]
# torch / vllm 由 tutti-env 提供（third_pkgs 源码 editable 安装，
# doc/intergration/tutti-vllm-manual.md）；隔离构建会去 PyPI 拉 cu130
# wheel 而失败，故只声明 setuptools 并用 --no-build-isolation 安装。
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tutti-vllm-connector"
version = "0.1.0"
description = "Tutti external vLLM connector: TuttiConnectorV1 scheduler adapter + TuttiEngine (ARCHITECTURE.md)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
# adapter/index/stores 为 PEP 420 命名空间包（纯目录即包）；engine/ 与 common/
# 必须带 __init__.py 成为常规包——命名空间包会被任何同名顶层模块抢占（曾实发于
# mooncake 的 site-packages 顶层 engine.so，已卸载；保留作防御）。
#
# common* 必须在清单内：engine/{core,metadata,staging,completion}.py 与
# stores/memory.py 共 5 处 `from common.utils import ...`，漏掉会让安装后的包
# 首次 import 即 ModuleNotFoundError；源码树直接跑 pytest 永远不暴露该缺陷。
#
# 不列入本清单的目录及原因：
#   transfer/  自带 setup.py，是独立 distribution（tutti-kv-transfer，CUDA 扩展）
#   bindings/  自带 setup.py，是独立 distribution（pybind 绑定）
#   scripts/   开发/压测工具，不属于运行时包
include = ["adapter*", "common*", "engine*", "index*", "stores*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不生成 .pytest_cache（env-tutti.sh 的 PYTEST_ADDOPTS 是全局兜底）
addopts = "-p no:cacheprovider"
