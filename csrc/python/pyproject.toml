[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.11,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "tutti-runtime"
version = "0.1.0"
description = "Python bindings for the Tutti StorageRuntime (pybind11, torch-free)"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["tutti_runtime"]
